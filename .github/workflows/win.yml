name: Windows

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_CONF: ${{ github.workspace }}/ss/bui/cmake/sccache.toml

jobs:
  build-test:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "Windows 2025 x86 MSVC", os: windows-2025, arch: x64 }
          - { name: "Windows 11 arm MSVC", os: windows-11-arm, arch: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.config.arch }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
        with:
          version: "v0.18.0"

      - name: Initialize optional sccache before compilation
        run: |
          git submodule update --init -- ss/bui
          cmake -P ss/bui/cmake/InitializeSccache.cmake

      - name: Configure CMake
        run: |
          # /Z7 embeds Debug symbols in .obj files, avoiding parallel MSVC compiler PDB writes.
          # Keep /Ob0, /Od and /RTC1 from CMake's standard Debug flags.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_C_COMPILER_LAUNCHER="$env:SCCACHE_LAUNCHER" `
            -DCMAKE_CXX_COMPILER_LAUNCHER="$env:SCCACHE_LAUNCHER" `
            -DCMAKE_CXX_FLAGS_DEBUG="/Z7 /Ob0 /Od /RTC1" `
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Release library
        if: matrix.build_type == 'Release'
        run: cmake --build build --parallel --target ariadne-benchmarking

      - name: Build and execute C++ benchmark tutorial
        if: matrix.build_type == 'Release'
        run: |
          cmake --build build --target tutorial_benchmarking 2>&1 | Tee-Object -FilePath build\\tutorial-compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\build\\tutorial\\tutorial_benchmarking.exe --lengths 32,64 --iterations 100,200 --samples 3 --warmups 1 --verbosity 4


      - name: Build Debug tests
        if: matrix.build_type == 'Debug'
        run: |
          cmake --build build --parallel --target tests 2>&1 | Tee-Object -FilePath build\\debug-compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Debug tests
        if: matrix.build_type == 'Debug'
        run: |
          ctest --test-dir build --output-on-failure 2>&1 | Tee-Object -FilePath build\\ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Temporary Windows compiler diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $logfile = if ('${{ matrix.build_type }}' -eq 'Debug') { 'build\\debug-compile.log' } else { 'build\\tutorial-compile.log' }
          if (Test-Path 'build\\ctest.log') { $logfile = 'build\\ctest.log' }
          $line = ''
          if (Test-Path $logfile) {
            $line = Get-Content $logfile | Where-Object { $_ -match 'FAIL:|ERROR:|\[FAIL [0-9]|\[ERROR [0-9]|warning C[0-9]+|error C[0-9]+|fatal error|error:|LNK[0-9]+' } | Where-Object { $_ -notmatch 'error C2220' } | Select-Object -First 1
          }
          if (-not $line) { $line = 'Failure after build or no compiler diagnostic' }
          $msg = [string]$line
          if ($msg.Length -gt 135) { $msg = $msg.Substring(0,135) }
          $payload = @{ state = "failure"; context = "benchmarking/msvc-error"; description = $msg } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } -Body $payload -ContentType "application/json"
