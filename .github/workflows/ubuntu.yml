name: Ubuntu

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_CONF: ${{ github.workspace }}/ss/bui/cmake/sccache.toml

jobs:
  build-test:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "Ubuntu 24.04 x86 Clang 16", os: ubuntu-24.04, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 arm Clang 16", os: ubuntu-24.04-arm, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 x86 GCC 12", os: ubuntu-24.04, cxx: "g++-12", pkg: "g++-12" }
          - { name: "Ubuntu 24.04 arm GCC 12", os: ubuntu-24.04-arm, cxx: "g++-12", pkg: "g++-12" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
        with:
          version: "v0.18.0"

      - name: Get Linux concurrency
        if: runner.os == 'Linux'
        run: echo "NPROC=$(nproc)" >> "$GITHUB_ENV"

      - name: Set up Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ${{ matrix.config.pkg }}

      - name: Initialize optional sccache before compilation
        run: |
          git submodule update --init -- ss/bui
          cmake -P ss/bui/cmake/InitializeSccache.cmake

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_LAUNCHER" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_LAUNCHER" \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Release library
        if: matrix.build_type == 'Release'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target ariadne-benchmarking

      - name: Build and execute C++ benchmark tutorial
        if: matrix.build_type == 'Release'
        run: |
          cmake --build "${{ runner.workspace }}/build" --target tutorial_benchmarking
          "${{ runner.workspace }}/build/tutorial/tutorial_benchmarking" --lengths 32,64 --iterations 100,200 --samples 3 --warmups 1 --verbosity 4


      - name: Build Debug tests
        if: matrix.build_type == 'Debug'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target tests

      - name: Run Debug tests
        if: matrix.build_type == 'Debug'
        run: |
          set -o pipefail
          ctest --test-dir "${{ runner.workspace }}/build" -j "$NPROC" --output-on-failure 2>&1 | tee "${{ runner.workspace }}/build/ctest-debug.log"

      - name: Record test failure diagnostic
        if: failure() && matrix.build_type == 'Debug'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="${{ runner.workspace }}/build/ctest-debug.log"
          # Publish a compact failed test line instead of the generic CTest exit code.
          line="$(grep -Ei '(^|[[:space:]])(FAIL:|ERROR:)|\[FAIL [0-9]|\[ERROR [0-9]' "$file" | head -n 1 || true)"
          if [ -z "$line" ]; then line="$(tail -n 2 "$file" | head -n 1)"; fi
          message="$(printf '%s' "$line" | cut -c 1-130)"
          payload="$(jq -n --arg m "$message" '{"state":"failure","context":"benchmarking/test-diagnostic","description":$m}')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" || true
